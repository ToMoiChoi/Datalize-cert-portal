<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verify a certificate · Datalize</title>
<meta name="robots" content="index,follow">
<link rel="icon" href="assets/favicon.svg">
<link rel="stylesheet" href="assets/fonts/fonts.css">
<link rel="stylesheet" href="assets/site.css">
</head>
<body>
<header class="top"><div class="wrap">
  <a href="https://datalize.cloud" class="brand"><img src="assets/logo.svg" alt="Datalize"></a>
  <a href="https://datalize.cloud" class="toplink">datalize.cloud</a>
</div></header>
<div class="center">
  <div class="lookup">
    <h1>Verify a certificate</h1>
    <p>Enter the certificate ID printed on any Datalize certificate.</p>
    <form id="f" autocomplete="off">
      <input id="q" name="id" placeholder="DLZ-XXXXXXXX" aria-label="Certificate ID" required>
      <button class="btn primary" type="submit">Verify</button>
    </form>
  </div>
</div>
<footer class="foot"><div class="wrap"><span>© 2026 Datalize</span><span>Official certificate registry</span></div></footer>
<script>
document.getElementById('f').addEventListener('submit', function (e) {
  e.preventDefault();
  var id = document.getElementById('q').value.trim().toUpperCase().replace(/[^A-Z0-9-]/g, '');
  if (id) location.href = '/' + id + '/';
});
</script>
</body>
</html>
